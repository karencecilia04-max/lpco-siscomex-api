name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt pytest
      - name: Testes em Python
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Testes em JavaScript (Apps Script)
        run: node --test google_sheets/tests/busca.test.mjs 
